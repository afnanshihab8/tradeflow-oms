name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: tradeflow_oms
          POSTGRES_USER: tradeflow
          POSTGRES_PASSWORD: tradeflow
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tradeflow -d tradeflow_oms"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DJANGO_SECRET_KEY: ci-only-secret-key
      DJANGO_DEBUG: "false"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
      POSTGRES_DB: tradeflow_oms
      POSTGRES_USER: tradeflow
      POSTGRES_PASSWORD: tradeflow
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: 5432
      EMAIL_BACKEND: django.core.mail.backends.locmem.EmailBackend

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install dependencies
        run: python -m pip install --upgrade pip -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Check formatting
        run: ruff format --check .

      - name: Run Django checks
        run: python manage.py check

      - name: Check migration drift
        run: python manage.py makemigrations --check --dry-run

      - name: Validate OpenAPI schema
        run: python manage.py spectacular --validate --file /tmp/schema.yml

      - name: Run tests with coverage
        run: pytest --cov --cov-report=term-missing --cov-fail-under=85

      - name: Validate Compose configuration
        run: docker compose --env-file .env.docker.example config --quiet

      - name: Build runtime container
        run: docker build --target runtime --tag tradeflow-oms:ci .
